description: ACORD is the global standards-setting body for the insurance industry. Standards (ACORD
  XML, NGDS / Next-Generation Digital Standards, Reinsurance & Large Commercial Specifications) are
  delivered to member organizations under member agreements. Public per-API pricing is not published —
  access is gated by ACORD membership, which is sold via direct engagement with the ACORD membership team.
source: https://www.acord.org/standards-architecture/acord-data-standards/standards-downloads
sources:
  - https://www.acord.org/standards-architecture/acord-data-standards/standards-downloads
  - https://www.acord.org/membership-participation/participate/join
  - https://www.acord.org/membership-participation/programs-offerings
evidence:
  - url: https://www.acord.org/standards-architecture/acord-data-standards/standards-downloads
    status: 200
    quote: >-
      "Once you join the proper ACORD membership or participation program, you will need to
      set up an account on acord.org to access the Standards and corresponding files
      available for that program. ... If you are interested in ACORD Membership, please
      email Member Services."
  - url: https://www.acord.org/file-download/04dcef0d-6222-46a2-911f-5c905db8e086
    status: 200
    note: >-
      Followed redirects to
      login.microsoftonline.com/44530ff1-5b52-459a-a4b9-66aa95755dfe/oauth2/v2.0/authorize —
      an anonymous request for a standards artifact lands on member sign-in, never on a file.
  - url: https://www.acord.org/membership-participation/participate/join
    status: 200
  - url: mailto:memberservices@acord.org
    status: null
    note: The pricing channel ACORD itself names on the downloads page.
notes: ACORD does not publish a public API price list. Membership dues vary by organization type (carrier,
  broker/agent, vendor/solution provider, reinsurer) and revenue band, and are quoted by ACORD. The
  scaffold below names the membership-based access plan; specific dollar values must come from the
  ACORD membership team.
plans:
  - id: acord-membership
    name: ACORD Membership (Standards Access)
    type: enterprise
    description: Membership grants access to ACORD standards, schema, certifications, and member-only
      tooling. Dues are scaled to organization type and revenue.
    entries:
      - label: Annual membership dues
        name: membership_dues
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact ACORD membership
        userMultiplied: false
    elements:
      - name: ACORD XML Standards (P&C, Life, Annuity, Reinsurance)
      - name: Next-Generation Digital Standards (NGDS)
      - name: Reference implementations and schema
      - name: Working group participation
      - name: ACORD Solutions Group services (where contracted separately)

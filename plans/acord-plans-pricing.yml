description: ACORD is the global standards-setting body for the insurance industry. Standards (ACORD
  XML, NGDS / Next-Generation Digital Standards, Reinsurance & Large Commercial Specifications) are
  delivered to member organizations under member agreements. Public per-API pricing is not published —
  access is gated by ACORD membership, which is sold via direct engagement with the ACORD membership team.
sources:
  - https://www.acord.org/standards-architecture/acord-data-standards
  - https://www.acord.org/about-acord/membership
notes: ACORD does not publish a public API price list. Membership dues vary by organization type (carrier,
  broker/agent, vendor/solution provider, reinsurer) and revenue band, and are quoted by ACORD. The
  scaffold below names the membership-based access plan; specific dollar values must come from the
  ACORD membership team.
plans:
  - id: acord-membership
    name: ACORD Membership (Standards Access)
    type: enterprise
    description: Membership grants access to ACORD standards, schema, certifications, and member-only
      tooling. Dues are scaled to organization type and revenue.
    entries:
      - label: Annual membership dues
        name: membership_dues
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact ACORD membership
        userMultiplied: false
    elements:
      - name: ACORD XML Standards (P&C, Life, Annuity, Reinsurance)
      - name: Next-Generation Digital Standards (NGDS)
      - name: Reference implementations and schema
      - name: Working group participation
      - name: ACORD Solutions Group services (where contracted separately)

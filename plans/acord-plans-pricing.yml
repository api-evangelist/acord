# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
# 2026-08-30: upgraded generated -> searched. The membership gate was read directly off
# ACORD's own Standards Downloads page and confirmed by probe: every standards artifact is
# a /file-download/<uuid> link that 302s to Microsoft Entra member sign-in. ACORD publishes
# no price list, so plan_count is 1 (the membership itself) with no published dollar value.

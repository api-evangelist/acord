description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: acord-free
    name: Free
    type: freemium
    description: Free entry tier for the ACORD API surface. Intended for evaluation, prototyping, and
      low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://claims.insurer-internal.example.com/acord
          - https://api.insurer-internal.example.com/ngds
          - https://reinsurance.insurer-internal.example.com/acord
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
          - https://claims.insurer-internal.example.com/acord
          - https://api.insurer-internal.example.com/ngds
          - https://reinsurance.insurer-internal.example.com/acord
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Public Documentation
      - name: Community Support
      - name: Sandbox Access
      - name: ACORD XML Standards API
      - name: ACORD Next-Generation Digital Standards (NGDS) API
      - name: ACORD Reinsurance & Large Commercial Data Standards API
  - id: acord-pro
    name: Professional
    type: paid
    description: Production tier for ACORD. Provides higher quotas, priority support, and access to the

        description: Monthly API request quota
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
        geo: global
        domains:
          - https://claims.insurer-internal.example.com/acord
          - https://api.insurer-internal.example.com/ngds
          - https://reinsurance.insurer-internal.example.com/acord
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the professional tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 100
        timeFrame: minute
        geo: global
        domains:
          - https://claims.insurer-internal.example.com/acord
          - https://api.insurer-internal.example.com/ngds
          - https://reinsurance.insurer-internal.example.com/acord

packages: []
rejected_candidates:
  - name: acord
    registry: pypi
    version: 0.0.1a0
    published: null
    official: false
    reason: >-
      Name collision only. PyPI "ACord" is a Discord API wrapper by Mecha-Karen
      (github.com/Mecha-Karen/acord), unrelated to ACORD the insurance standards body.
      Recorded so a later pass does not re-find it and mistake it for first-party.
notes: >-
  Member-only construction tools and implementation guides are referenced on
  https://www.acord.org/standards-architecture/implement-standards , but they are delivered
  through the member download gate rather than a package registry, so they carry no
  registry version or publish date to record. No SDKs pointer is emitted for this provider.

specification: API Commons Packages
specificationVersion: '0.1'
provider: ACORD
providerId: acord
generated: '2026-08-30'
method: searched
source: >-
  Searched registry.npmjs.org, pypi.org, and the acord.org / acordsolutions.com sites for a
  first-party ACORD client library, SDK or CLI. Probed api.github.com/orgs for acord, ACORD,
  acord-standards, ACORDstandards and acordsolutions — all 404, so ACORD publishes no GitHub
  organization to host one.
description: >-
  ACORD publishes no first-party SDK or client package on any public registry. This is
  consistent with its model: ACORD ships message standards and schemas to members under
  licence, and implementers build against those inside their own systems. Vendor and
  community libraries that implement ACORD formats exist, but none is authored by ACORD, so
  none is listed here.
package_count: 0

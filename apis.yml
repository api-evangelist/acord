description: >-
  ACORD is the global standards-setting body for the insurance industry, publishing the data
  standards that insurers, reinsurers, brokers, MGAs and software vendors use to exchange
  policy, claims, party, underwriting, accounting and settlement data: ACORD XML and AL3 for
  property & casualty, Life & Annuity XML and DTCC EDI, the Global Reinsurance & Large
  Commercial (GRLC) standards behind EBOT, ECOT, GPM and CRP, and the JSON/YAML
  Next-Generation Digital Standards (NGDS) aimed at REST APIs and microservices. ACORD
  operates no public API of its own; standards and schemas are delivered to members under
  licence, and its commercial subsidiary ACORD Solutions Group runs the ADEPT data exchange
  platform under separate agreement.

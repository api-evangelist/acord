description: FOCUS-aligned FinOps scaffold for ACORD. ACORD invoices member organizations for annual
  membership and, separately, for ACORD Solutions Group services. There are no per-API metered charges
  because ACORD publishes standards rather than operating an API.
sources:
  - https://www.acord.org/standards-architecture/acord-data-standards
  - https://www.acord.org/about-acord/membership
notes: ACORD does not publish public dues; FinOps shape below describes the typical line items a member
  organization would see — annual membership and optional Solutions Group / certification fees.
billingModel:
  pricingCategory: Membership + Optional Services
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: ACORD
  ServiceCategory: Insurance Standards / Data Exchange
  ProviderName: ACORD
  PublisherName: ACORD Corporation
  InvoiceIssuerName: ACORD Corporation
  BillingCurrency: USD

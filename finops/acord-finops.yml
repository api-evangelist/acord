meters:
  - name: annual_membership
    description: ACORD annual membership dues, scaled to organization type and revenue.
    unit: year
    aggregation: sum
    dimensions:
      - organization_type
      - revenue_band
  - name: acord_solutions_group_service
    description: Project-based billing from ACORD Solutions Group (data services, reinsurance services,
      onboarding services).
    unit: project
    aggregation: sum
    dimensions:
      - service_line
  - name: certification_fee
    description: Per-certification fee (e.g. AL3, ACORD certification programs).
    unit: certification
    aggregation: sum
    dimensions:
      - program
principles:
  - name: Visibility
    description: Track ACORD line items from the membership invoice and any ACORD Solutions Group statements
      of work; there is no usage API.
  - name: Allocation
    description: Allocate membership cost to the standards / architecture function; allocate Solutions
      Group projects to the line of business that sponsored the engagement (claims, policy, reinsurance).
  - name: Optimization
    description: Optimization is governance — ensuring the organization adopts ACORD versions consistently
      so investments in standard implementations don't fragment.
  - name: Accountability
    description: Standards / data-architecture leadership owns the membership relationship; project owners
      own Solutions Group spend.

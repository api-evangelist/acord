  - version: P&C XML and AL3 2026-1 SE Report
    date: '2026'
    type: enhancement-report
    breaking: unknown
    highlights: Property & Casualty XML and AL3 standards enhancements, cycle 2026-1.
  - version: Life & Annuity Forms SE Reports 2026-04 (ACORD 782, ACORD 951e)
    date: '2026-04'
    type: enhancement-report
    breaking: unknown
    highlights: Forms standard enhancements for ACORD 782 and ACORD 951e.
  - version: NGDS Final Release v1-12-0
    date: '2025-11'
    type: release
    breaking: unknown
    highlights: Prior NGDS final release; still listed and available to members.
  - version: NGDS Object Model launch
    date: '2025-08-28'
    type: asset
    breaking: false
    highlights: >-
      ACORD launched the NGDS Object Model, a framework aligning NGDS data exchange with
      business processes and underlying data elements. Reachable at
      https://standards.acord.org/#/ngds/objectmodel (member sign-in).
  - version: NGDS Final Release v1-11-0
    date: '2025-05'
    type: release
    breaking: unknown
    highlights: Prior NGDS final release; still listed and available to members.
notes: >-
  breaking is recorded as unknown throughout rather than guessed: the release documents that
  would state it are behind the member download gate, and inferring breakage from a release
  title would be fabrication.

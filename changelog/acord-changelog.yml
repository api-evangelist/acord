specification: API Commons ChangeLog
specificationVersion: '0.1'
provider: ACORD
providerId: acord
generated: '2026-08-30'
method: searched
source: >-
  https://www.acord.org/standards-architecture/acord-data-standards/next-generation-digital-standards
  and https://www.acord.org/standards-architecture/get-involved/standards-enhancements
description: >-
  ACORD publishes no API changelog, because it operates no public API. What it does publish
  is a standards release train and a set of Standards Enhancement Reports per standards
  family. Those are the change record, and they are what is captured here.
scheme: dated standards releases plus per-family Standards Enhancement Reports
current_version: NGDS Final Release v1-13-0
current_version_date: '2026-05'
public_url: https://www.acord.org/standards-architecture/acord-data-standards/next-generation-digital-standards
machine_readable: false
gated: true
gate_note: >-
  Release titles and report titles are listed publicly; every document behind them is a
  /file-download/<uuid> link that 302s to Microsoft Entra member sign-in.
entries:
  - version: NGDS Final Release v1-13-0
    date: '2026-05'
    type: release
    breaking: unknown
    highlights: >-
      Current ACORD Next-Generation Digital Standards final release. Complete release
      document containing all files and artifacts for the release.
  - version: NGDS Standards Enhancement Report
    date: '2026-04'
    type: enhancement-report
    breaking: unknown
    highlights: >-
      Next-Generation Digital Standards Enhancement Report – April 2026; member-voted

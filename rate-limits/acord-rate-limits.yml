specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: ACORD
providerId: acord
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - ACORD
  - Insurance
  - Standards
  - Property Casualty
  - Life
  - Reinsurance
  - Rate Limiting
description: ACORD publishes data-exchange standards (XML, JSON / NGDS) rather than running a centrally
  hosted API. Implementations live inside carriers, brokers, and reinsurers; rate limits are governed
  by the implementer's own gateway, not by ACORD. ACORD itself does not publish per-second / per-minute
  numbers because there is no single ACORD-hosted endpoint.
sources:
  - https://www.acord.org/standards-architecture/acord-data-standards
notes: No central ACORD API to rate-limit. Reconciled flag is false because there are no provider-published
  numbers; downstream limits are set per-carrier when ACORD messages are exposed via SOAP / REST.
responseCodes: {}
limits: []
policies:
  - name: Implementer-Owned
    description: ACORD defines the message contract; the operating insurer / broker owns concurrency,
      throttling, and retry policy at their own gateway.
  - name: Standards Versioning
    description: ACORD versions the standards (e.g. ACORD XML versions, NGDS revisions). Trading partners
      negotiate which versions and operations are accepted.
maintainers:

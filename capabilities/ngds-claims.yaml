naftiko: 1.0.0-alpha2
info:
  label: ACORD Next-Generation Digital Standards (NGDS) API — Claims
  description: 'ACORD Next-Generation Digital Standards (NGDS) API — Claims. 3 operations. Lead operation: ACORD List Claims.
    Self-contained Naftiko capability covering one Acord business surface.'
  tags:
  - Acord
  - Claims
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACORD_API_KEY: ACORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: ngds-claims
    baseUri: https://api.insurer-internal.example.com/ngds
    description: ACORD Next-Generation Digital Standards (NGDS) API — Claims business capability. Self-contained, no shared
      references.
    resources:
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: ACORD List Claims
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: policyId
          in: query
          type: string
        - name: claimNumber
          in: query
          type: string
        - name: status
          in: query
          type: string
        - name: lossDateFrom
          in: query
          type: string
        - name: lossDateTo
          in: query
          type: string
      - name: submitclaim
        method: POST
        description: ACORD Submit a New Claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: claims-claimId
      path: /claims/{claimId}
      operations:
      - name: getclaim
        method: GET
        description: ACORD Get Claim by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.ACORD_API_KEY}}'
  exposes:
  - type: rest
    namespace: ngds-claims-rest
    port: 8080
    description: REST adapter for ACORD Next-Generation Digital Standards (NGDS) API — Claims. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/claims
      name: claims
      description: REST surface for claims.
      operations:
      - method: GET
        name: listclaims
        description: ACORD List Claims
        call: ngds-claims.listclaims
        with:
          policyId: rest.policyId
          claimNumber: rest.claimNumber
          status: rest.status
          lossDateFrom: rest.lossDateFrom
          lossDateTo: rest.lossDateTo
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submitclaim
        description: ACORD Submit a New Claim
        call: ngds-claims.submitclaim
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/claims/{claimid}
      name: claims-claimid
      description: REST surface for claims-claimId.
      operations:
      - method: GET
        name: getclaim
        description: ACORD Get Claim by ID
        call: ngds-claims.getclaim
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ngds-claims-mcp
    port: 9090
    transport: http
    description: MCP adapter for ACORD Next-Generation Digital Standards (NGDS) API — Claims. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: acord-list-claims
      description: ACORD List Claims
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ngds-claims.listclaims
      with:
        policyId: tools.policyId
        claimNumber: tools.claimNumber
        status: tools.status
        lossDateFrom: tools.lossDateFrom
        lossDateTo: tools.lossDateTo
      outputParameters:
      - type: object
        mapping: $.
    - name: acord-submit-new-claim
      description: ACORD Submit a New Claim
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ngds-claims.submitclaim
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: acord-get-claim-id
      description: ACORD Get Claim by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ngds-claims.getclaim
      with:
        claimId: tools.claimId
      outputParameters:
      - type: object
        mapping: $.
